[package]
name = "shimeji-gui-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
serde_json = "1"
tar = "0.4"
regex = "1"
nix = { version = "0.29", features = ["term", "process", "fs", "signal", "poll"] }
eframe = { version = "0.31", default-features = true }
rfd = "0.15"
ksni = { version = "0.3", features = ["blocking"] }
image = { version = "0.25", default-features = false, features = ["png","jpeg","gif","webp","qoi"] }

[dev-dependencies]
tempfile = "3"
